name: Release Tagging Workflow

on:
  release:
    types: [ published ]

jobs:
  preflight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31.11.1
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./scripts/staging/shell.nix

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate if the release should be even made
        run: |
          nix-shell --pure --run "./scripts/staging/validate.sh \
            --tag ${{ github.ref_name }} \
            --type release" ./scripts/staging/shell.nix

  release-images:
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31.11.1
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./scripts/staging/shell.nix

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror images from dev to Docker Hub
        run: |
          nix-shell --pure --run "./scripts/staging/mirror-images.sh \
            --source ghcr.io/${{ github.repository_owner }}/dev \
            --target docker.io/${{ github.repository_owner }} \
            --tag ${{ github.ref_name }}" ./scripts/staging/shell.nix

  release-kubectl-binaries:
    runs-on: ubuntu-latest
    needs: preflight-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31.11.1
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./scripts/staging/shell.nix

      - name: Mirror kubectl artifacts from staging
        run: |
          nix-shell --pure --run "./scripts/staging/kubectl-oci.sh pull \
            --tag ${{ github.ref_name }} \
            --namespace ${{ github.repository_owner }}/dev/plugin \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}" ./scripts/staging/shell.nix

      - name: Upload kubectl artifacts to release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mayastor/scripts/github/release-artifacts.sh \
            --tag ${{ github.ref_name }} \
            --repo-org ${{ github.repository_owner }} \
            --upload ${{ github.event.repository.name }} \
            upload

  update-krew-index:
    runs-on: ubuntu-latest
    needs: release-kubectl-binaries
    steps:
      - name: Get Latest Release Tag
        id: latest-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION=$(gh api repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          echo "Latest published version: $LATEST_VERSION"
          echo "latestTag=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Update krew index
        if: ${{ !github.event.release.prerelease && (steps.latest-release.outputs.latestTag == github.event.release.tag_name) }}
        uses: rajatjindal/krew-release-bot@v0.0.51

  release-helm-chart:
    runs-on: ubuntu-latest
    needs: [release-images, preflight-checks]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch openebs umbrella helm chart
        env:
          RAW_TAG: ${{ github.ref_name }}
          IMAGE_ORG: ${{ github.repository_owner }}
        run: |
          VERSION=${RAW_TAG#v}
          echo "CHART_VERSION=$VERSION" >> $GITHUB_ENV

          rm -rf charts
          mkdir -p charts-staged charts-final charts

          CHART_REF=oci://ghcr.io/${IMAGE_ORG}/dev/helm/openebs
          helm pull "$CHART_REF" \
            --version ${VERSION} \
            --destination charts-staged

          tar -xzf charts-staged/openebs-"$VERSION".tgz -C charts-final

          mv charts-final/openebs/* charts

      - name: Update the umbrella images for release
        run: |
          nix-shell --pure --run "./scripts/helm/images.sh generate" ./scripts/helm/shell.nix
          nix-shell --pure --run "./scripts/helm/images.sh patch" ./scripts/helm/shell.nix

      - name: Publish openebs umbrella helm chart
        uses: stefanprodan/helm-gh-pages@v1.7.0
        env:
          TMPDIR: /tmp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: .

      - name: Publish openebs umbrella helm chart as OCI
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: openebs
          repository: ${{ github.repository_owner }}/charts
          tag: ${{ env.CHART_VERSION }}
          path: ./charts
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: 'false'

  chart-sboms:
    runs-on: ubuntu-latest
    needs: [release-helm-chart, release-kubectl-binaries]
    permissions:
      # To upload the bundle to the release, and to attest it.
      contents: write
      id-token: write
      attestations: write
      packages: read

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31.11.1
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./scripts/staging/shell.nix

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Most of the chart comes from Docker Hub; logging in keeps the anonymous
      # pull limit out of the picture, which otherwise starts failing to resolve
      # images partway through and reports them as unresolved.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Chart Version
        run: echo "CHART_VERSION=${TAG#v}" >> $GITHUB_ENV

      # Against the released chart, so the inventory matches what was published
      # rather than what staging happened to hold. The kubectl bundle is only
      # ever pushed to the staging namespace, so that is where it is read from.
      #
      # --verify requires that every attestation found, whoever published it,
      # verifies against an openebs workflow identity. An artefact with no
      # attestation is reported rather than fatal, since most of the umbrella's
      # images are still in that state. The default shell has no pipefail, and
      # without it the status below would be tee's, never the script's.
      - name: Collect the SBOMs of everything the chart deploys
        id: sboms
        env:
          PLUGIN: openebs
        run: |
          set -o pipefail
          {
            echo '### Chart SBOM coverage'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          ./mayastor/scripts/github/chart-sboms.sh \
            --chart oci://ghcr.io/${{ github.repository_owner }}/charts/openebs \
            --version "${CHART_VERSION}" \
            --registry ghcr.io \
            --namespace ${{ github.repository_owner }}/dev/plugin \
            --tag "${TAG}" \
            --verify | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # Without the marker the script leaves for itself to recognise its output.
      - name: Bundle the SBOMs
        run: tar -czf "sboms-${TAG}.tar.gz" --exclude=.chart-sboms -C sboms .

      # Provenance of the bundle itself, the same way the kubectl archives are
      # attested in release-binaries.yml. This says the collection came from this
      # workflow. The documents inside are the bare SBOMs, unwrapped from their
      # attestations: what vouches for each is the cosign attestation left on the
      # artefact in the registry, and the summary.json alongside says which were
      # verified against it and which were not.
      - name: Attest the SBOM bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sboms-${{ github.ref_name }}.tar.gz

      - name: Upload the SBOM bundle to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" --clobber "sboms-${TAG}.tar.gz"

      - name: Fail if an attestation did not verify
        if: steps.sboms.outputs.rc != '0'
        run: |
          echo "The SBOM collection is attached to the release, but verification"
          echo "failed - see the coverage table in the job summary."
          exit 1
