name: Publish chart upon release creation

on:
  release:
    types:
      - "created"

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0
            submodules: recursive

      - uses: cachix/install-nix-action@v22
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --pure --run "echo" ./shell.nix

      - name: Remove prerelease label from dependencies
        run: |
            nix-shell --pure --run "./scripts/helm/update-dependencies-version-upon-release.sh --localpv-provisioner-version ${LOCALPV_PROVISIONER_VERSION} --zfs-localpv-version ${ZFS_LOCALPV_VERSION} --lvm-localpv-version ${LVM_LOCALPV_VERSION} --mayastor-version ${MAYASTOR_VERSION}" ./shell.nix

      - name: Check if the chart is publishable
        run: |
          TAG=${{ github.event.release.tag_name }}
          nix-shell --pure --run "./scripts/helm/update-chart-version.sh --tag $TAG --publish-release" ./shell.nix

      - name: Debug Workflow Directory
        run: ls -l ./charts

      - name: Publish openebs umbrella helm chart
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: .