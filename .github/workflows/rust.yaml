name: Rust CI
on:
  pull_request:
    branches:
      - develop
      - 'release/**'
  push:
    branches:
      - develop
      - 'release/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  rust-linter-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            rust:
              - 'plugin/**'
              - 'openebs-upgrade/**'
              - 'nix/**'
              - shell.nix
              - default.nix
              - Cargo.toml
              - Cargo.lock
              - 'mayastor/**'
      - uses: ./mayastor/dependencies/control-plane/utils/dependencies/.github/actions/setup-nix
        if: steps.changes.outputs.rust == 'true'
        with:
          pre-fetch-nix: ./shell.nix
          rust-cache: true
      - name: Lint rust code
        if: steps.changes.outputs.rust == 'true'
        run: nix-shell --run "./scripts/rust/linter.sh"
      - name: Build rust binaries
        if: steps.changes.outputs.rust == 'true'
        run: nix-shell --run "cargo build --all"
      - name: Ensure Cargo.lock is up to date
        run: |
          if git diff --name-only | grep -q 'Cargo.lock'; then
            echo "Cargo.lock is not up to date!"
            exit 1
          fi
